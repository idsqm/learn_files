services:
  files-app:
    build:
      context: .
      target: runner
    ports:
      - "${SERVER_PORT:-8082}:8082"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8082}
      DATABASE_URL: postgres://${POSTGRES_USER:-files}:${POSTGRES_PASSWORD:-files}@files-db:5432/${POSTGRES_DB:-files}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DEBUG: ${DEBUG:-false}
      S3_ENDPOINT: http://minio:9000
      # Presigned URLs are handed to the browser, which reaches MinIO from outside the
      # learnquest network — must be a different, host-reachable address (see internal/storage).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-learnquest-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_USE_PATH_STYLE: "true"
      PRESIGNED_URL_TTL: ${PRESIGNED_URL_TTL:-1h}
      PENDING_FILE_TTL: ${PENDING_FILE_TTL:-24h}
    depends_on:
      files-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - learnquest

  files-dev:
    build:
      context: .
      target: builder
    working_dir: /app
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-files}:${POSTGRES_PASSWORD:-files}@files-db:5432/${POSTGRES_DB:-files}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-learnquest-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_USE_PATH_STYLE: "true"
    depends_on:
      files-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    profiles:
      - tools
    networks:
      - learnquest

  files-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-files}
      POSTGRES_USER: ${POSTGRES_USER:-files}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-files}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-files}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - learnquest

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      # Browsers PUT directly to presigned URLs on this endpoint, so it needs
      # to answer CORS preflight/PUT requests from the frontend dev origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:5173}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - learnquest

  # One-shot job that creates the bucket on first startup (MinIO doesn't do this itself).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-learnquest-files}
      "
    networks:
      - learnquest

volumes:
  pgdata:
  miniodata:
  gomodcache:

networks:
  learnquest:
    external: true
