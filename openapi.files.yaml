openapi: 3.0.3
info:
  title: Files Service API
  version: 1.0.0

servers:
  - url: http://localhost:8082
    description: Local development

paths:
  # ── Files (Public) ──────────────────────────────────────

  /api/v1/files/{id}:
    get:
      summary: Get file metadata
      operationId: getFile
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "404":
          $ref: "#/components/responses/Error"

    delete:
      summary: Delete a file (owner only)
      operationId: deleteFile
      tags: [files]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/files/{id}/download:
    get:
      summary: Redirect to a presigned GET URL for the file
      operationId: downloadFile
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "302":
          description: Redirect to presigned GET URL
          headers:
            Location:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: File is not ready (status pending/failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Files (Protected) ────────────────────────────────────

  /api/v1/files:
    post:
      summary: Create a file record and get a presigned PUT URL
      operationId: createFile
      tags: [files]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileRequest"
      responses:
        "201":
          description: File record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFileResponse"
        "422":
          description: Validation error, invalid file type, or file too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/files/{id}/complete:
    post:
      summary: Confirm upload completion (service verifies the object via HEAD)
      operationId: completeFile
      tags: [files]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: File marked as ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Upload not confirmed in storage, or file too large / wrong type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/me/files:
    get:
      summary: List files owned by the current user
      operationId: listMyFiles
      tags: [files]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of files
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/File"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FileID:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Error:
      description: Business error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Kind:
      type: string
      enum: [video, document, image]

    Status:
      type: string
      enum: [pending, ready, failed]

    File:
      type: object
      properties:
        id:
          type: integer
        owner_user_id:
          type: string
          format: uuid
        filename:
          type: string
        mime_type:
          type: string
        kind:
          $ref: "#/components/schemas/Kind"
        size_bytes:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/Status"
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
          nullable: true

    CreateFileRequest:
      type: object
      required: [filename, mime_type, size_bytes, kind]
      properties:
        filename:
          type: string
          example: lesson-01.mp4
        mime_type:
          type: string
          example: video/mp4
        size_bytes:
          type: integer
          format: int64
          example: 524288000
        kind:
          $ref: "#/components/schemas/Kind"

    CreateFileResponse:
      type: object
      properties:
        id:
          type: integer
        upload_url:
          type: string
          description: Presigned PUT URL; upload directly to this URL with a matching Content-Type header
        expires_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - FILE_NOT_FOUND
                - FILE_NOT_OWNED
                - FILE_NOT_READY
                - INVALID_FILE_TYPE
                - FILE_TOO_LARGE
                - UPLOAD_NOT_CONFIRMED
                - STORAGE_ERROR
                - ACCESS_TOKEN_EXPIRED
                - ACCESS_TOKEN_INVALID
                - INTERNAL_ERROR
            message:
              type: string

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
